<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Queue - Scan QR</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh;">
        <header>
            <h1>Queue Management Demo</h1>
            <p>Scan the QR Code with your smartphone to join the queue</p>
        </header>

        <div class="glass-panel" style="text-align: center; max-width: 500px; width: 100%;">
            <div style="background: white; padding: 20px; border-radius: 16px; display: inline-block; margin-bottom: 1.5rem;">
                <img src="/static/qr/token_qr.png" alt="QR Code" style="width: 250px; height: 250px;">
            </div>
            
            <p style="margin-bottom: 1rem; color: var(--text-muted);">Or visit this URL on your phone browser:</p>
            <div style="background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 1.2rem; margin-bottom: 2rem;">
                {{ url }}
            </div>

            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <button class="btn" style="border: 1px solid var(--glass-border); background: var(--glass-bg);" onclick="window.open('/display', '_blank')">Public Display</button>
                <button class="btn" style="border: 1px solid var(--glass-border); background: var(--glass-bg);" onclick="window.open('/counter', '_blank')">Staff Counter</button>
                <button class="btn" style="border: 1px solid var(--glass-border); background: var(--glass-bg);" onclick="window.open('/kiosk', '_blank')">Kiosk UI</button>
            </div>
        </div>
    </div>
</body>
</html>
