<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Vending Machine</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body style="align-items: center; justify-content: center;">
    <div class="container" style="max-width: 800px; text-align: center;">
        <div class="glass-panel" style="padding: 4rem 2rem;">
            <h1 style="font-size: 3rem; margin-bottom: 2rem;">Hospital Services</h1>
            <p style="font-size: 1.5rem; color: var(--text-muted); margin-bottom: 3rem;">Please select a service category:</p>
            
            <div style="display: flex; flex-direction: column; gap: 1.5rem; align-items: center;">
                <button class="btn btn-success" style="width: 100%; max-width: 500px; font-size: 2rem; padding: 1.5rem;" onclick="generateKioskToken('OPD')">
                    OUTPATIENT (OPD)
                </button>
                <button class="btn" style="width: 100%; max-width: 500px; font-size: 2rem; padding: 1.5rem; background: linear-gradient(135deg, #ef4444, #b91c1c);" onclick="generateKioskToken('Emergency')">
                    EMERGENCY 🚨
                </button>
                <button class="btn" style="width: 100%; max-width: 500px; font-size: 2rem; padding: 1.5rem; background: linear-gradient(135deg, #3b82f6, #1d4ed8);" onclick="generateKioskToken('Lab')">
                    LABORATORY
                </button>
            </div>

            <div id="print-area" style="display: none; margin-top: 4rem; background: #fff; color: #000; padding: 2rem; width: 320px; margin-left: auto; margin-right: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-bottom: 3px dashed #ccc;">
                <h3 id="print-category" style="margin-bottom: 1rem; border-bottom: 2px solid #000; padding-bottom: 0.5rem; color: #666;">Service Token</h3>
                <h1 style="font-size: 4rem; margin: 1rem 0;" id="kiosk-token-num">--</h1>
                <p>Wait for your number on the display.</p>
            </div>
        </div>
    </div>

    <script>
        async function generateKioskToken(category) {
            try {
                const response = await fetch('/api/generate', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category: category })
                });
                const data = await response.json();
                
                document.getElementById('print-area').style.display = 'block';
                document.getElementById('kiosk-token-num').innerText = data.token_number;
                document.getElementById('print-category').innerText = category.toUpperCase() + ' TOKEN';
                
                setTimeout(() => {
                    document.getElementById('print-area').style.display = 'none';
                }, 5000);
            } catch (err) {
                console.error(err);
                alert("Machine Error");
            }
        }
    </script>
</body>
</html>
